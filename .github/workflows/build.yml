name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest :autosend:testDebugUnitTest
      - name: Build APK
        run: ./gradlew :app:assembleRelease :autosend:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: RVault-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSend-apk
          path: autosend/build/outputs/apk/release/autosend-release.apk
